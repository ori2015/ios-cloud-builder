name: Secure central iOS build
run-name: iOS Build ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Unique full build UUID
        required: true
        type: string
      project_id:
        description: Opaque registered project handle
        required: true
        type: string
      artifact_recipient:
        description: AGE X25519 public recipient for this build
        required: true
        type: string
      operation:
        description: Unsigned local build, protected TestFlight deployment, or signed ad hoc IPA
        required: true
        default: build
        type: choice
        options:
          - build
          - testflight
          - adhoc

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Checkout trusted public builder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: builder
          persist-credentials: false

      - name: Set up trusted Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: builder/go.mod
          cache: false

      - name: Build trusted runner before private checkout
        working-directory: builder
        run: |
          go mod verify
          go build -trimpath -o "$RUNNER_TEMP/builder-runner" ./cmd/builder-runner

      - name: Resolve opaque project and mask private metadata
        id: project
        env:
          BUILD_ID: ${{ inputs.build_id }}
          PROJECT_ID: ${{ inputs.project_id }}
          ARTIFACT_RECIPIENT: ${{ inputs.artifact_recipient }}
          OPERATION: ${{ inputs.operation }}
          PROJECT_REGISTRY: ${{ secrets.PROJECT_REGISTRY }}
        run: |
          "$RUNNER_TEMP/builder-runner" resolve-project \
            --build-id "$BUILD_ID" \
            --project-id "$PROJECT_ID" \
            --artifact-recipient "$ARTIFACT_RECIPIENT" \
            --operation "$OPERATION" \
            --registry "$PROJECT_REGISTRY" \
            --github-output "$GITHUB_OUTPUT"

      - name: Create repository-scoped GitHub App token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.project.outputs.source_owner }}
          repositories: ${{ steps.project.outputs.source_repo }}
          permission-contents: read
          skip-token-revoke: true

      - name: Checkout exactly the authorized private snapshot
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ steps.project.outputs.source_owner }}/${{ steps.project.outputs.source_repo }}
          ref: ${{ steps.project.outputs.snapshot_ref }}
          token: ${{ steps.source-token.outputs.token }}
          path: source
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false
          submodules: false
          lfs: false

      - name: Revoke private repository token before project code
        if: always() && steps.source-token.outcome == 'success'
        env:
          SOURCE_TOKEN: ${{ steps.source-token.outputs.token }}
        run: |
          "$RUNNER_TEMP/builder-runner" revoke-token

      - name: Verify checkout credential cleanup
        run: |
          "$RUNNER_TEMP/builder-runner" verify-checkout --source "$GITHUB_WORKSPACE/source"

      - name: Restore bounded large-file snapshot chunks
        run: |
          "$RUNNER_TEMP/builder-runner" restore-snapshot --source "$GITHUB_WORKSPACE/source"

      - name: Detect supported iOS framework
        id: detect
        env:
          FRAMEWORK_HINT: ${{ steps.project.outputs.framework_hint }}
        run: |
          echo "Preparing framework toolchain"
          "$RUNNER_TEMP/builder-runner" detect \
            --source "$GITHUB_WORKSPACE/source" \
            --framework "$FRAMEWORK_HINT" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.detect.outputs.framework == 'react-native' || steps.detect.outputs.framework == 'expo' || steps.detect.outputs.framework == 'cordova' || steps.detect.outputs.framework == 'ionic'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '20'

      - name: Set up Java for Kotlin Multiplatform
        if: steps.detect.outputs.framework == 'kmp'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        if: steps.detect.outputs.framework == 'flutter'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: false

      - name: Build unsigned IPA and encrypt private outputs
        id: secure-build
        continue-on-error: true
        env:
          IOS_PATH: ${{ steps.project.outputs.ios_path }}
          SCHEME: ${{ steps.project.outputs.scheme }}
          CONFIGURATION: ${{ steps.project.outputs.configuration }}
          BUNDLE_ID: ${{ steps.project.outputs.bundle_id }}
          FRAMEWORK: ${{ steps.detect.outputs.framework }}
          ARTIFACT_RECIPIENT: ${{ inputs.artifact_recipient }}
          IPA_RECIPIENT: ${{ inputs.operation != 'build' && vars.PACKAGING_RECIPIENT || inputs.artifact_recipient }}
          OPERATION: ${{ inputs.operation }}
          CODE_SIGNING_ALLOWED: 'NO'
          CODE_SIGNING_REQUIRED: 'NO'
        run: |
          intermediate=()
          if [ "$OPERATION" != "build" ]; then intermediate=(--project-intermediate); fi
          "$RUNNER_TEMP/builder-runner" execute \
            --source "$GITHUB_WORKSPACE/source" \
            --ios-path "$IOS_PATH" \
            --scheme "$SCHEME" \
            --configuration "$CONFIGURATION" \
            --framework "$FRAMEWORK" \
            --bundle-id "$BUNDLE_ID" \
            --log "$RUNNER_TEMP/private-output/build.log" \
            --ipa "$RUNNER_TEMP/private-output/App.ipa" \
            --recipient "$ARTIFACT_RECIPIENT" \
            --ipa-recipient "$IPA_RECIPIENT" \
            --output "$RUNNER_TEMP/encrypted" \
            "${intermediate[@]}"

      - name: Upload ciphertext only
        id: upload
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: ios-builder-${{ inputs.build_id }}
          path: |
            ${{ runner.temp }}/encrypted/build.log.age
            ${{ runner.temp }}/encrypted/App.ipa.age
            ${{ runner.temp }}/encrypted/project-output.age
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false
          compression-level: 0

      - name: Report private build status
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.secure-build.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          if [ "$UPLOAD_OUTCOME" != "success" ]; then
            echo "Encrypted artifact upload failed. No private diagnostics were printed."
            exit 1
          fi
          if [ "$BUILD_OUTCOME" != "success" ]; then
            echo "Build failed. Download the encrypted diagnostic log using Builder CLI."
            exit 1
          fi
          echo "Build succeeded. Encrypted artifacts uploaded."

  trusted-package:
    if: inputs.operation == 'testflight' || inputs.operation == 'adhoc'
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Checkout trusted public builder only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: builder
          persist-credentials: false

      - name: Set up trusted Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: builder/go.mod
          cache: false

      - name: Build isolated trusted packaging runner
        working-directory: builder
        run: |
          go mod verify
          go build -trimpath -o "$RUNNER_TEMP/builder-runner" ./cmd/builder-runner

      - name: Download encrypted project output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ios-builder-${{ inputs.build_id }}
          path: ${{ runner.temp }}/project-intermediate

      - name: Create trusted TestFlight intermediate
        id: package
        continue-on-error: true
        env:
          PACKAGING_AGE_IDENTITY: ${{ secrets.PACKAGING_AGE_IDENTITY }}
          APPLE_SIGNING_RECIPIENT: ${{ vars.APPLE_SIGNING_RECIPIENT }}
        run: |
          "$RUNNER_TEMP/builder-runner" trusted-package \
            --input "$RUNNER_TEMP/project-intermediate" \
            --output "$RUNNER_TEMP/trusted-output" \
            --build-id "${{ inputs.build_id }}" \
            --project-id "${{ inputs.project_id }}" \
            --builder-commit "$GITHUB_SHA" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --recipient "$APPLE_SIGNING_RECIPIENT" \
            --log "$RUNNER_TEMP/package-private/build.log"

      - name: Cryptographically attest trusted output
        id: attest
        if: steps.package.outcome == 'success'
        continue-on-error: true
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-path: |
            ${{ runner.temp }}/trusted-output/App.ipa.age
            ${{ runner.temp }}/trusted-output/provenance.json
          show-summary: false

      - name: Upload authenticated intermediate only
        id: trusted-upload
        if: steps.package.outcome == 'success' && steps.attest.outcome == 'success'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: ios-builder-trusted-${{ inputs.build_id }}
          path: |
            ${{ runner.temp }}/trusted-output/App.ipa.age
            ${{ runner.temp }}/trusted-output/provenance.json
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false
          compression-level: 0

      - name: Encrypt trusted-packaging failure diagnostic
        if: steps.package.outcome != 'success' || steps.attest.outcome != 'success'
        env:
          ARTIFACT_RECIPIENT: ${{ inputs.artifact_recipient }}
        run: |
          if [ ! -f "$RUNNER_TEMP/package-private/build.log" ]; then
            mkdir -p "$RUNNER_TEMP/package-private"
            printf '%s\n' 'GitHub provenance attestation generation failed.' > "$RUNNER_TEMP/package-private/build.log"
            chmod 600 "$RUNNER_TEMP/package-private/build.log"
          fi
          "$RUNNER_TEMP/builder-runner" encrypt-diagnostic \
            --log "$RUNNER_TEMP/package-private/build.log" \
            --recipient "$ARTIFACT_RECIPIENT" \
            --output "$RUNNER_TEMP/package-diagnostic"

      - name: Upload encrypted trusted-packaging diagnostic only
        if: steps.package.outcome != 'success' || steps.attest.outcome != 'success'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: ios-builder-deploy-${{ inputs.build_id }}
          path: ${{ runner.temp }}/package-diagnostic/build.log.age
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false
          compression-level: 0

      - name: Report trusted packaging status
        if: always()
        env:
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          ATTEST_OUTCOME: ${{ steps.attest.outcome }}
          UPLOAD_OUTCOME: ${{ steps.trusted-upload.outcome }}
        run: |
          if [ "$PACKAGE_OUTCOME" != "success" ] || [ "$ATTEST_OUTCOME" != "success" ] || [ "$UPLOAD_OUTCOME" != "success" ]; then
            echo "Trusted packaging failed. No private diagnostics were printed."
            exit 1
          fi
          echo "Authenticated TestFlight intermediate uploaded."

  sign-adhoc:
    if: inputs.operation == 'adhoc'
    needs: trusted-package
    environment: apple-production
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Checkout trusted public builder only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: builder
          persist-credentials: false

      - name: Set up trusted Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: builder/go.mod
          cache: false

      - name: Build trusted signing runner
        working-directory: builder
        run: |
          go mod verify
          go build -trimpath -o "$RUNNER_TEMP/builder-runner" ./cmd/builder-runner

      - name: Download authenticated unsigned intermediate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ios-builder-trusted-${{ inputs.build_id }}
          path: ${{ runner.temp }}/intermediate

      - name: Verify provenance before loading Apple credentials
        id: provenance
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/builder-runner" verify-provenance \
            --input "$RUNNER_TEMP/intermediate" \
            --build-id "${{ inputs.build_id }}" \
            --project-id "${{ inputs.project_id }}" \
            --builder-commit "$GITHUB_SHA" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --repository "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ios-build.yml" \
            --source-ref "$GITHUB_REF" \
            --log "$RUNNER_TEMP/provenance-private/build.log"

      # Unlike TestFlight, the signed application is the deliverable here, so it
      # is encrypted to the calling project's own recipient and handed back.
      - name: Sign for ad hoc installation
        id: sign
        if: steps.provenance.outcome == 'success'
        continue-on-error: true
        env:
          APPLE_SIGNING_AGE_IDENTITY: ${{ secrets.APPLE_SIGNING_AGE_IDENTITY }}
          APPLE_DISTRIBUTION_P12: ${{ secrets.APPLE_DISTRIBUTION_P12 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_ADHOC_PROVISIONING_PROFILE }}
          APPLE_PROVISIONING_PROFILES: ${{ secrets.APPLE_ADHOC_PROVISIONING_PROFILES }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ARTIFACT_RECIPIENT: ${{ inputs.artifact_recipient }}
        run: |
          "$RUNNER_TEMP/builder-runner" sign-adhoc \
            --encrypted-ipa "$RUNNER_TEMP/intermediate/App.ipa.age" \
            --manifest "$RUNNER_TEMP/intermediate/provenance.json" \
            --build-id "${{ inputs.build_id }}" \
            --project-id "${{ inputs.project_id }}" \
            --builder-commit "$GITHUB_SHA" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --log "$RUNNER_TEMP/adhoc-private/build.log" \
            --recipient "$ARTIFACT_RECIPIENT" \
            --output "$RUNNER_TEMP/adhoc-encrypted"

      - name: Encrypt provenance rejection diagnostics
        if: steps.provenance.outcome != 'success'
        env:
          ARTIFACT_RECIPIENT: ${{ inputs.artifact_recipient }}
        run: |
          "$RUNNER_TEMP/builder-runner" encrypt-diagnostic \
            --log "$RUNNER_TEMP/provenance-private/build.log" \
            --recipient "$ARTIFACT_RECIPIENT" \
            --output "$RUNNER_TEMP/adhoc-encrypted"

      - name: Upload encrypted ad hoc result only
        id: adhoc-upload
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: ios-builder-adhoc-${{ inputs.build_id }}
          path: |
            ${{ runner.temp }}/adhoc-encrypted/build.log.age
            ${{ runner.temp }}/adhoc-encrypted/App.ipa.age
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false
          compression-level: 0

      - name: Report ad hoc signing status
        if: always()
        env:
          SIGN_OUTCOME: ${{ steps.sign.outcome }}
          PROVENANCE_OUTCOME: ${{ steps.provenance.outcome }}
          UPLOAD_OUTCOME: ${{ steps.adhoc-upload.outcome }}
        run: |
          if [ "$UPLOAD_OUTCOME" != "success" ]; then
            echo "Encrypted ad hoc artifact upload failed."
            exit 1
          fi
          if [ "$PROVENANCE_OUTCOME" != "success" ] || [ "$SIGN_OUTCOME" != "success" ]; then
            echo "Ad hoc signing failed. Download the encrypted diagnostic log using Builder CLI."
            exit 1
          fi
          echo "Ad hoc signing completed. The signed IPA is encrypted to the calling project."

  sign-and-deploy:
    if: inputs.operation == 'testflight'
    needs: trusted-package
    environment: apple-production
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Checkout trusted public builder only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: builder
          persist-credentials: false

      - name: Set up trusted Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: builder/go.mod
          cache: false

      - name: Build trusted signing runner
        working-directory: builder
        run: |
          go mod verify
          go build -trimpath -o "$RUNNER_TEMP/builder-runner" ./cmd/builder-runner

      - name: Download authenticated unsigned intermediate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ios-builder-trusted-${{ inputs.build_id }}
          path: ${{ runner.temp }}/intermediate

      - name: Verify provenance before loading Apple credentials
        id: provenance
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/builder-runner" verify-provenance \
            --input "$RUNNER_TEMP/intermediate" \
            --build-id "${{ inputs.build_id }}" \
            --project-id "${{ inputs.project_id }}" \
            --builder-commit "$GITHUB_SHA" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --repository "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ios-build.yml" \
            --source-ref "$GITHUB_REF" \
            --log "$RUNNER_TEMP/provenance-private/build.log"

      - name: Sign and upload directly to App Store Connect
        id: deploy
        if: steps.provenance.outcome == 'success'
        continue-on-error: true
        env:
          APPLE_SIGNING_AGE_IDENTITY: ${{ secrets.APPLE_SIGNING_AGE_IDENTITY }}
          APPLE_DISTRIBUTION_P12: ${{ secrets.APPLE_DISTRIBUTION_P12 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_PROVISIONING_PROFILES: ${{ secrets.APPLE_PROVISIONING_PROFILES }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TESTFLIGHT_BETA_GROUPS: ${{ secrets.TESTFLIGHT_BETA_GROUPS }}
          ARTIFACT_RECIPIENT: ${{ inputs.artifact_recipient }}
        run: |
          "$RUNNER_TEMP/builder-runner" deploy-testflight \
            --encrypted-ipa "$RUNNER_TEMP/intermediate/App.ipa.age" \
            --manifest "$RUNNER_TEMP/intermediate/provenance.json" \
            --build-id "${{ inputs.build_id }}" \
            --project-id "${{ inputs.project_id }}" \
            --builder-commit "$GITHUB_SHA" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --log "$RUNNER_TEMP/deploy-private/build.log" \
            --build-number auto \
            --recipient "$ARTIFACT_RECIPIENT" \
            --output "$RUNNER_TEMP/deploy-encrypted"

      - name: Encrypt provenance rejection diagnostics
        if: steps.provenance.outcome != 'success'
        env:
          ARTIFACT_RECIPIENT: ${{ inputs.artifact_recipient }}
        run: |
          "$RUNNER_TEMP/builder-runner" encrypt-diagnostic \
            --log "$RUNNER_TEMP/provenance-private/build.log" \
            --recipient "$ARTIFACT_RECIPIENT" \
            --output "$RUNNER_TEMP/deploy-encrypted"

      - name: Upload encrypted deployment diagnostic only
        id: deploy-upload
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: ios-builder-deploy-${{ inputs.build_id }}
          path: ${{ runner.temp }}/deploy-encrypted/build.log.age
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false
          compression-level: 0

      - name: Report protected deployment status
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          PROVENANCE_OUTCOME: ${{ steps.provenance.outcome }}
          UPLOAD_OUTCOME: ${{ steps.deploy-upload.outcome }}
        run: |
          if [ "$UPLOAD_OUTCOME" != "success" ]; then
            echo "Encrypted deployment diagnostic upload failed."
            exit 1
          fi
          if [ "$PROVENANCE_OUTCOME" != "success" ] || [ "$DEPLOY_OUTCOME" != "success" ]; then
            echo "TestFlight deployment failed. Download the encrypted diagnostic log using Builder CLI."
            exit 1
          fi
          echo "App Store Connect deployment completed. Configured beta-group publishing, when present, also completed."
