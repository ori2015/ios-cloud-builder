name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        # go.mod requires 1.24, so anything below it silently downloads a 1.24
        # toolchain and tests nothing new. These are the oldest and newest supported.
        go: ['1.24', '1.27']

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Download dependencies
        run: go mod download

      # The runner's end-to-end tests build a generic fixture with xcodebuild and
      # inspect the resulting IPA. They skip themselves wherever Xcode is absent.
      - name: Install XcodeGen
        if: runner.os == 'macOS'
        run: brew install xcodegen

      - name: Run tests
        run: go test -v -race ./...

      - name: Verify framework detection matrix
        if: runner.os == 'Linux'
        run: scripts/verify-matrix.sh

      - name: Build
        run: go build -v ./cmd/builder

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          # golangci-lint v2.12.2 predates Go 1.27 language changes. Lint with
          # the minimum supported toolchain; the test matrix still covers 1.27.
          go-version: '1.24'
          cache: false

      - name: Check formatting
        run: |
          gofmt -l .
          test -z "$(gofmt -l .)"

      - name: Run go vet
        run: go vet ./...

      # Keep this pinned; upgrade it before linting with a newer Go toolchain.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          args: --timeout=5m
          skip-cache: true
          skip-save-cache: true

  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27'
          cache: false

      - name: Build all platforms
        run: |
          mkdir -p dist
          GOOS=darwin GOARCH=amd64 go build -o dist/builder-darwin-amd64 ./cmd/builder
          GOOS=darwin GOARCH=arm64 go build -o dist/builder-darwin-arm64 ./cmd/builder
          GOOS=linux GOARCH=amd64 go build -o dist/builder-linux-amd64 ./cmd/builder
          GOOS=linux GOARCH=arm64 go build -o dist/builder-linux-arm64 ./cmd/builder
          GOOS=windows GOARCH=amd64 go build -o dist/builder-windows-amd64.exe ./cmd/builder

      - name: Upload artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: binaries
          path: dist/

  # Real builds: scaffold a project with each framework's own generator and run
  # the unsigned pipeline on it. Slow and network-dependent, so separate from the
  # unit-test matrix; each leg is independent.
  e2e-frameworks:
    name: Real build (${{ matrix.framework }})
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # the same Xcode the central build job selects
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        framework: [tauri, nativescript, sparkling, maui, godot]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.24'
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'

      - name: Install Tauri iOS prerequisites
        if: matrix.framework == 'tauri'
        run: brew install xcodegen libimobiledevice

      - name: Install Godot
        if: matrix.framework == 'godot'
        run: scripts/install-godot.sh 4.4 "$RUNNER_TEMP/godot"

      - name: Build ${{ matrix.framework }} and inspect the IPA
        env:
          BUILDER_E2E_FRAMEWORKS: ${{ matrix.framework }}
          GODOT_DIR: ${{ runner.temp }}/godot
        run: go test -v -timeout 50m -run 'TestE2EFramework' ./internal/runner

